[project]
name = "docmd"
version = "0.3.0"
description = "Convert Office documents and PDFs to GitHub Flavored Markdown."
requires-python = ">=3.11"
dependencies = [
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "pymupdf==2.0",
    "rapidocr==3.10.0",
    "openvino==2026.4.1",
    "opencv-python-headless==5.0.0.93",
    "msoffcrypto-tool==6.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
