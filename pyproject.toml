[project]
name = "docmd"
version = "0.2.0"
description = "Convert Office documents and PDFs to GitHub Flavored Markdown."
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.2",
    "python-pptx>=1.0",
    "pymupdf>=1.24",
    "rapidocr-openvino>=1.3",
    "openvino>=2024.6,<2025",
    "opencv-python-headless>=4.9",
    "msoffcrypto-tool>=5.4",
]

[tool.uv]
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
